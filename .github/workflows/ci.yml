name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore <OWNER_HANDLE>-ERC.slnx

      - name: Build (Release)
        run: dotnet build <OWNER_HANDLE>-ERC.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test <OWNER_HANDLE>-ERC.slnx --configuration Release --no-build --verbosity normal
